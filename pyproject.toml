[tool.uv.workspace]
members = [
    "apps/api",
    "mcp/shared",
    "mcp/learner-memory",
    "mcp/curriculum",
    "mcp/dictionary",
    "mcp/grammar",
    "mcp/locale",
    "mcp/conversation",
    "mcp/review",
    "mcp/analytics",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "node_modules", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Prompt templates are sent verbatim to a model; line breaks are meaningful.
"tools/generate-curriculum.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
polyglot-coach-api = { workspace = true }
polyglot-coach-shared = { workspace = true }
polyglot-coach-learner-memory = { workspace = true }
polyglot-coach-curriculum = { workspace = true }
polyglot-coach-dictionary = { workspace = true }
polyglot-coach-grammar = { workspace = true }
polyglot-coach-locale = { workspace = true }
polyglot-coach-conversation = { workspace = true }
polyglot-coach-review = { workspace = true }
polyglot-coach-analytics = { workspace = true }
