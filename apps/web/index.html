<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polyglot Coach</title>
<style>
  :root {
    --base: #1e1e2e;
    --mantle: #181825;
    --crust: #11111b;
    --surface0: #313244;
    --surface1: #45475a;
    --surface2: #585b70;
    --overlay0: #6c7086;
    --overlay1: #7f849c;
    --overlay2: #9399b2;
    --subtext0: #a6adc8;
    --subtext1: #bac2de;
    --text: #cdd6f4;
    --lavender: #b4befe;
    --blue: #89b4fa;
    --sapphire: #74c7ec;
    --teal: #94e2d5;
    --green: #a6e3a1;
    --yellow: #f9e2af;
    --peach: #fab387;
    --maroon: #eba0ac;
    --red: #f38ba8;
    --mauve: #cba6f7;
    --pink: #f5c2e7;
    --flamingo: #f2cdcd;
    --rosewater: #f5e0dc;
    --radius: 12px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--base);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--mantle);
    border-bottom: 1px solid var(--surface1);
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--mauve);
    letter-spacing: -0.3px;
  }
  .header-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--overlay1);
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--surface2);
    transition: background 0.3s;
  }
  .status-dot.online { background: var(--green); }
  .status-dot.offline { background: var(--red); }

  /* Layout */
  .layout {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  /* Chat area */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .messages:empty::after {
    content: 'Start a conversation to begin learning.';
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--overlay0);
    font-style: italic;
    font-size: 14px;
  }

  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: var(--radius);
    line-height: 1.5;
    animation: fadeIn 0.2s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .msg.user {
    align-self: flex-end;
    background: var(--mauve);
    color: var(--base);
    border-bottom-right-radius: 4px;
  }
  .msg.tutor {
    align-self: flex-start;
    background: var(--surface0);
    border-bottom-left-radius: 4px;
  }
  .msg.tutor .correction {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--surface2);
    font-size: 13px;
    color: var(--yellow);
  }
  .msg.tutor .correction .label { color: var(--overlay2); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .msg.tutor .correction .why { color: var(--subtext0); margin-top: 2px; }
  .msg.tutor .correction .alt { color: var(--teal); margin-top: 2px; }

  .msg.loading {
    align-self: flex-start;
    background: var(--surface0);
    border-bottom-left-radius: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid var(--surface2);
    border-top-color: var(--mauve);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Input */
  .input-bar {
    padding: 12px 20px;
    background: var(--mantle);
    border-top: 1px solid var(--surface1);
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .input-bar input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--surface1);
    border-radius: var(--radius);
    background: var(--surface0);
    color: var(--text);
    font-size: 14px;
    font-family: var(--font);
    outline: none;
    transition: border-color 0.2s;
  }
  .input-bar input:focus { border-color: var(--mauve); }
  .input-bar input::placeholder { color: var(--overlay0); }
  .input-bar button {
    padding: 10px 20px;
    border: none;
    border-radius: var(--radius);
    background: var(--mauve);
    color: var(--base);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
    font-family: var(--font);
  }
  .input-bar button:disabled { opacity: 0.4; cursor: not-allowed; }
  .input-bar button:not(:disabled):hover { opacity: 0.9; }
  .input-bar .mic-btn {
    padding: 10px 12px;
    background: var(--surface1);
    color: var(--text);
    font-size: 16px;
  }
  .input-bar .mic-btn.recording {
    background: var(--red);
    color: var(--base);
    animation: micPulse 1.1s ease-in-out infinite;
  }
  @keyframes micPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(243, 139, 168, 0.45); }
    50% { box-shadow: 0 0 0 6px rgba(243, 139, 168, 0); }
  }

  /* Settings sidebar */
  .sidebar {
    width: 300px;
    background: var(--mantle);
    border-left: 1px solid var(--surface1);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .sidebar h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--overlay1);
    margin-bottom: 2px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--overlay1); font-weight: 500; }
  .field select, .field input {
    padding: 8px 10px;
    border: 1px solid var(--surface1);
    border-radius: 8px;
    background: var(--surface0);
    color: var(--text);
    font-size: 13px;
    font-family: var(--font);
    outline: none;
    transition: border-color 0.2s;
  }
  .field select:focus, .field input:focus { border-color: var(--mauve); }
  .field select option { background: var(--surface0); color: var(--text); }
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--overlay1);
    cursor: pointer;
    margin-top: 4px;
  }
  .toggle-row input { accent-color: var(--mauve); }
  .toggle-row input:disabled + span { opacity: 0.5; }
  .language-meta {
    font-size: 11px;
    color: var(--overlay0);
    min-height: 16px;
    margin-top: 2px;
  }
  .feature-list { display: flex; flex-direction: column; gap: 6px; }
  .feature-item {
    display: flex;
    gap: 8px;
    padding: 8px;
    border: 1px solid var(--surface1);
    border-radius: 8px;
    background: var(--surface0);
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .feature-item:hover { border-color: var(--mauve); }
  .feature-item input {
    accent-color: var(--mauve);
    margin-top: 2px;
    flex-shrink: 0;
  }
  .feature-item .fname { display: block; font-size: 13px; font-weight: 500; }
  .feature-item .fcat {
    display: inline-block;
    margin-top: 1px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--mauve);
  }
  .feature-item .fdesc {
    display: block;
    margin-top: 2px;
    font-size: 11px;
    line-height: 1.35;
    color: var(--overlay1);
  }
  .feature-hint { font-size: 11px; color: var(--overlay0); line-height: 1.4; }
  .btn-secondary {
    padding: 8px 14px;
    border: 1px solid var(--surface1);
    border-radius: 8px;
    background: var(--surface0);
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    font-family: var(--font);
  }
  .btn-secondary:hover { border-color: var(--mauve); background: var(--surface1); }

  .profile-row { display: flex; gap: 6px; }
  .profile-row input { flex: 1; }
  .profile-row button { flex-shrink: 0; }

  .sidebar-status { font-size: 12px; color: var(--overlay0); padding-top: 8px; border-top: 1px solid var(--surface1); }
  .sidebar-status .good { color: var(--green); }
  .sidebar-status .bad { color: var(--red); }

  @media (max-width: 720px) {
    .sidebar { display: none; }
    .msg { max-width: 90%; }
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 20px;
    border-radius: 8px;
    background: var(--surface1);
    color: var(--text);
    font-size: 13px;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <h1>Polyglot Coach</h1>
  <div class="header-status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusLabel">Checking...</span>
  </div>
</div>

<div class="layout">
  <div class="chat-area">
    <div class="messages" id="messages"></div>
    <div class="input-bar">
      <button id="micBtn" class="mic-btn" disabled aria-label="Record speech" title="Push to talk">🎤</button>
      <input type="text" id="chatInput" placeholder="Type a message..." autofocus>
      <button id="sendBtn" disabled>Send</button>
    </div>
  </div>

  <div class="sidebar" id="sidebar">
    <div>
      <h2>Profile</h2>
      <div class="field profile-row">
        <input type="text" id="profileInput" placeholder="Your name" value="Learner">
        <button class="btn-secondary" id="profileBtn" disabled>Load</button>
      </div>
      <div style="font-size:11px;color:var(--overlay0);margin-top:4px" id="profileId"></div>
    </div>

    <div>
      <h2>Session</h2>
      <div class="field">
        <label for="langSelect">Language</label>
        <select id="langSelect" disabled>
          <option value="">Loading languages…</option>
        </select>
        <div class="language-meta" id="languageMeta"></div>
      </div>
      <div class="field">
        <label for="levelSelect">Level</label>
        <select id="levelSelect" disabled>
          <option value="">—</option>
        </select>
      </div>
      <div class="field">
        <label for="modeSelect">Mode</label>
        <select id="modeSelect">
          <option value="conversation">Conversation</option>
          <option value="lesson">Lesson</option>
          <option value="grammar">Grammar Focus</option>
          <option value="vocabulary">Vocabulary Focus</option>
          <option value="roleplay">Roleplay</option>
          <option value="assessment">Assessment</option>
          <option value="immersion">Immersion</option>
        </select>
      </div>
      <div class="field">
        <label for="localeSelect">Locale</label>
        <select id="localeSelect" disabled>
          <option value="">—</option>
        </select>
      </div>
      <label class="toggle-row">
        <input type="checkbox" id="speakReplies" disabled>
        <span>Speak tutor replies</span>
      </label>
    </div>

    <div>
      <h2>Model Provider</h2>
      <div class="field">
        <label for="providerSelect">Provider</label>
        <select id="providerSelect">
          <option value="server">Server default</option>
          <option value="openai">OpenAI-compatible (own key)</option>
        </select>
      </div>
      <div id="byokFields" hidden>
        <div class="field">
          <label for="llmBaseUrl">Base URL</label>
          <input type="url" id="llmBaseUrl" placeholder="https://api.openai.com/v1">
        </div>
        <div class="field">
          <label for="llmModel">Model</label>
          <input type="text" id="llmModel" placeholder="gpt-4o-mini">
        </div>
        <div class="field">
          <label for="llmApiKey">API key</label>
          <input type="password" id="llmApiKey" placeholder="sk-..." autocomplete="off" spellcheck="false">
        </div>
        <button class="btn-secondary" id="llmSaveBtn" style="width:100%">Use provider</button>
        <div class="feature-hint" style="margin-top:6px">
          Kept in this tab only. Requests go through your local API server.
        </div>
      </div>
    </div>

    <div>
      <h2>Advanced Focus</h2>
      <div class="feature-hint" style="margin-bottom:6px">Pick language-specific features to prioritize in this session.</div>
      <div class="feature-list" id="featureList">
        <div class="feature-hint">Loading features…</div>
      </div>
    </div>

    <div>
      <h2>Quick Start</h2>
      <button class="btn-secondary" id="scenarioBtn" style="width:100%" disabled>Load Scenario</button>
    </div>

    <div class="sidebar-status" id="sidebarStatus"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = window.location.origin;

// State
let profileId = parseInt(localStorage.getItem('pc_profile_id')) || null;
let profileName = localStorage.getItem('pc_profile_name') || 'Learner';
let conversationHistory = [];
let languageMap = new Map();
const msgContainer = document.getElementById('messages');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const statusDot = document.getElementById('statusDot');
const statusLabel = document.getElementById('statusLabel');
const langSelect = document.getElementById('langSelect');
const levelSelect = document.getElementById('levelSelect');
const localeSelect = document.getElementById('localeSelect');
const featureList = document.getElementById('featureList');
const languageMeta = document.getElementById('languageMeta');
const micBtn = document.getElementById('micBtn');
const speakReplies = document.getElementById('speakReplies');
const providerSelect = document.getElementById('providerSelect');
const byokFields = document.getElementById('byokFields');
const llmBaseUrl = document.getElementById('llmBaseUrl');
const llmModel = document.getElementById('llmModel');
const llmApiKey = document.getElementById('llmApiKey');
const llmSaveBtn = document.getElementById('llmSaveBtn');

const DEFAULT_LLM_BASE_URL = 'https://api.openai.com/v1';
const DEFAULT_LLM_MODEL = 'gpt-4o-mini';

let sttAvailable = false;
let ttsAvailable = false;
let isRecording = false;
let sttBusy = false;
let mediaRecorder = null;
let recordedChunks = [];
let recordingMime = 'audio/webm';
let currentAudio = null;
let currentAudioUrl = null;

speakReplies.checked = localStorage.getItem('pc_speak_replies') === '1';
speakReplies.addEventListener('change', () => {
  localStorage.setItem('pc_speak_replies', speakReplies.checked ? '1' : '0');
});

const FALLBACK_LANGUAGES = [
  { code: 'es', name: 'Spanish', native_name: 'Español', status: 'active', script: 'Latin', levels: ['A1'], default_level: 'A1', locales: [{ code: 'neutral', name: 'Neutral' }], features: [] },
  { code: 'fr', name: 'French', native_name: 'Français', status: 'preview', script: 'Latin', levels: ['A1'], default_level: 'A1', locales: [{ code: 'neutral', name: 'Neutral' }], features: [] },
  { code: 'de', name: 'German', native_name: 'Deutsch', status: 'preview', script: 'Latin', levels: ['A1'], default_level: 'A1', locales: [{ code: 'neutral', name: 'Neutral' }], features: [] },
];

// Init
document.getElementById('profileInput').value = profileName;
if (profileId) document.getElementById('profileId').textContent = `ID: ${profileId}`;

// Escape a value for use inside an HTML attribute.
function escapeAttr(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[char]));
}

function localeLabel(locale) {
  const code = locale.code || 'neutral';
  const name = locale.name || code;
  return code === 'neutral' ? name : `${name} (${code})`;
}

async function loadLanguages() {
  let languages = [];
  try {
    const res = await fetch(`${API}/api/v1/meta/languages`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    languages = data.languages || [];
  } catch {
    showToast('Language metadata unavailable — using offline defaults.');
  }
  if (!languages.length) languages = FALLBACK_LANGUAGES;

  languageMap = new Map(languages.map(language => [language.code, language]));
  langSelect.innerHTML = languages
    .map(language => `<option value="${escapeAttr(language.code)}">${escapeHtml(language.name)} — ${escapeHtml(language.native_name || language.name)}</option>`)
    .join('');
  langSelect.disabled = false;
  levelSelect.disabled = false;
  localeSelect.disabled = false;
  document.getElementById('profileBtn').disabled = false;
  document.getElementById('scenarioBtn').disabled = false;

  const saved = localStorage.getItem('pc_language');
  langSelect.value = languageMap.has(saved) ? saved : languages[0].code;
  applyLanguageSelection();
}

function applyLanguageSelection(preferredLevel, preferredLocale) {
  const language = languageMap.get(langSelect.value);
  if (!language) return;

  const levels = language.levels && language.levels.length ? language.levels : ['A1'];
  levelSelect.innerHTML = levels
    .map(level => `<option value="${escapeAttr(level)}">${escapeHtml(level)}</option>`)
    .join('');
  const level = levels.includes(preferredLevel)
    ? preferredLevel
    : (levels.includes(language.default_level) ? language.default_level : levels[0]);
  levelSelect.value = level;

  const locales = language.locales && language.locales.length
    ? language.locales
    : [{ code: 'neutral', name: 'Neutral' }];
  localeSelect.innerHTML = locales
    .map(locale => `<option value="${escapeAttr(locale.code)}">${escapeHtml(localeLabel(locale))}</option>`)
    .join('');
  const localeCodes = locales.map(locale => locale.code);
  localeSelect.value = localeCodes.includes(preferredLocale)
    ? preferredLocale
    : (localeCodes.includes('neutral') ? 'neutral' : localeCodes[0]);

  const framework = language.level_framework_name || language.level_framework;
  languageMeta.textContent = [
    language.native_name && language.native_name !== language.name ? language.native_name : null,
    framework,
    language.script,
    language.status,
  ].filter(Boolean).join(' · ');

  renderFeatures(language, levelSelect.value);
  localStorage.setItem('pc_language', language.code);
}

function renderFeatures(language, level) {
  const features = (language.features || []).filter(feature =>
    !feature.levels || feature.levels.length === 0 || feature.levels.includes(level)
  );
  if (!features.length) {
    featureList.innerHTML = '<div class="feature-hint">No advanced features are declared for this level yet.</div>';
    return;
  }
  featureList.innerHTML = features.map(feature => `
    <label class="feature-item">
      <input type="checkbox" value="${escapeAttr(feature.id)}">
      <span>
        <span class="fname">${escapeHtml(feature.name || feature.id)}</span>
        <span class="fcat">${escapeHtml(feature.category || 'feature')}</span>
        <span class="fdesc">${escapeHtml(feature.description || '')}</span>
      </span>
    </label>`).join('');
}

langSelect.addEventListener('change', () => {
  conversationHistory = [];
  applyLanguageSelection();
});
levelSelect.addEventListener('change', () => {
  const language = languageMap.get(langSelect.value);
  if (language) renderFeatures(language, levelSelect.value);
});

// Load scenario
document.getElementById('scenarioBtn').addEventListener('click', async () => {
  const lang = document.getElementById('langSelect').value;
  const level = document.getElementById('levelSelect').value;
  try {
    const res = await fetch(`${API}/api/v1/curriculum/lessons?language=${lang}&level=${level}`);
    const data = await res.json();
    const scenarios = data.scenarios || [];
    if (!scenarios.length) { showToast('No scenarios found for this level.'); return; }
    const sc = scenarios[Math.floor(Math.random() * scenarios.length)];
    document.getElementById('modeSelect').value = 'roleplay';
    addMessage(`Scenario: ${sc.title}\n\n${sc.context}`, 'tutor');
  } catch { showToast('Could not load scenarios.'); }
});

// Profile management
document.getElementById('profileBtn').addEventListener('click', loadProfile);
document.getElementById('profileInput').addEventListener('keydown', e => { if (e.key === 'Enter') loadProfile(); });

async function loadProfile() {
  const name = document.getElementById('profileInput').value.trim() || 'Learner';
  try {
    let res = await fetch(`${API}/api/v1/learner/profiles/${encodeURIComponent(name)}`);
    if (res.status === 404) {
      const settings = getSettings();
      res = await fetch(`${API}/api/v1/learner/profiles`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          name,
          native_language: 'en',
          target_language: settings.lang,
          locale: settings.locale,
          proficiency_level: settings.level,
        }),
      });
      if (!res.ok) { showToast('Failed to create profile.'); return; }
    } else if (!res.ok) { showToast('Failed to load profile.'); return; }
    const profile = await res.json();
    profileId = profile.id;
    profileName = profile.name;
    localStorage.setItem('pc_profile_id', profileId);
    localStorage.setItem('pc_profile_name', profileName);
    document.getElementById('profileId').textContent = `ID: ${profileId}`;
    if (languageMap.has(profile.target_language)) {
      langSelect.value = profile.target_language;
    }
    applyLanguageSelection(profile.proficiency_level, profile.locale);
    showToast(`Profile "${profileName}" loaded.`);
  } catch { showToast('Could not connect to server.'); }
}

// Speech input and playback
function resetMic() {
  isRecording = false;
  micBtn.classList.remove('recording');
  micBtn.textContent = '🎤';
  micBtn.title = sttAvailable ? 'Push to talk' : 'Speech-to-text is not installed';
  micBtn.disabled = !sttAvailable || sttBusy;
}

async function responseDetail(res) {
  let detail = res.statusText;
  try {
    const error = await res.json();
    if (typeof error.detail === 'string') detail = error.detail;
  } catch { /* keep status text */ }
  return detail;
}

async function startRecording() {
  if (!sttAvailable || sttBusy || isRecording) return;
  if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') {
    showToast('Audio recording is not supported in this browser.');
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordingMime = [
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/ogg;codecs=opus',
      'audio/mp4',
    ].find(type => MediaRecorder.isTypeSupported?.(type)) || '';
    mediaRecorder = recordingMime
      ? new MediaRecorder(stream, { mimeType: recordingMime })
      : new MediaRecorder(stream);
    recordedChunks = [];

    mediaRecorder.ondataavailable = event => {
      if (event.data && event.data.size) recordedChunks.push(event.data);
    };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(track => track.stop());
      if (!recordedChunks.length) {
        resetMic();
        showToast('No audio was recorded.');
        return;
      }
      transcribeRecording();
    };

    mediaRecorder.start();
    isRecording = true;
    micBtn.classList.add('recording');
    micBtn.textContent = '■';
    micBtn.title = 'Stop recording';
    showToast('Recording… click the button again to stop.');
  } catch {
    showToast('Microphone permission denied or unavailable.');
  }
}

function stopRecording() {
  if (!mediaRecorder || !isRecording) return;
  isRecording = false;
  sttBusy = true;
  mediaRecorder.stop();
  micBtn.classList.remove('recording');
  micBtn.textContent = '⏳';
  micBtn.title = 'Transcribing…';
  micBtn.disabled = true;
}

async function transcribeRecording() {
  const settings = getSettings();
  const blob = new Blob(recordedChunks, { type: recordingMime || 'audio/webm' });
  const extension = recordingMime.includes('ogg') ? 'ogg'
    : recordingMime.includes('mp4') ? 'm4a'
    : 'webm';
  const form = new FormData();
  form.append('audio', blob, `recording.${extension}`);
  form.append('language', settings.lang);
  form.append('level', settings.level);
  form.append('locale', settings.locale);

  try {
    const res = await fetch(`${API}/api/v1/speech/transcribe`, { method: 'POST', body: form });
    if (!res.ok) {
      showToast(await responseDetail(res));
      return;
    }
    const data = await res.json();
    if (!data.text) {
      showToast('No speech detected in that recording.');
      return;
    }
    chatInput.value = data.text;
    chatInput.focus();
    showToast('Transcript ready — edit it or press Send.');
  } catch {
    showToast('Could not transcribe the recording.');
  } finally {
    recordedChunks = [];
    sttBusy = false;
    resetMic();
  }
}

function stopCurrentAudio() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
  if (currentAudioUrl) {
    URL.revokeObjectURL(currentAudioUrl);
    currentAudioUrl = null;
  }
}

async function playTutorSpeech(text) {
  if (!ttsAvailable || !speakReplies.checked || !text.trim()) return;
  const settings = getSettings();
  try {
    const res = await fetch(`${API}/api/v1/speech/synthesize`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: text.slice(0, 2000),
        language: settings.lang,
        level: settings.level,
        locale: settings.locale,
      }),
    });
    if (!res.ok) {
      showToast(await responseDetail(res));
      return;
    }
    const blob = await res.blob();
    if (!blob.size) {
      showToast('Speech synthesis returned no audio.');
      return;
    }
    stopCurrentAudio();
    currentAudioUrl = URL.createObjectURL(blob);
    currentAudio = new Audio(currentAudioUrl);
    currentAudio.addEventListener('ended', stopCurrentAudio, { once: true });
    await currentAudio.play();
  } catch {
    showToast('Could not play the tutor response.');
  }
}

micBtn.addEventListener('click', () => {
  if (isRecording) stopRecording();
  else startRecording();
});

// Chat
sendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }});

async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text || sendBtn.disabled) return;

  addMessage(text, 'user');
  chatInput.value = '';
  sendBtn.disabled = true;
  stopCurrentAudio();

  const loadingId = addLoading();

  try {
    const settings = getSettings();
    const res = await fetch(`${API}/api/v1/tutor/chat`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', ...llmHeaders()},
      body: JSON.stringify({
        profile_id: profileId || 1,
        message: text,
        language: settings.lang,
        level: settings.level,
        mode: settings.mode,
        locale: settings.locale,
        features: settings.features,
        conversation_history: conversationHistory,
      }),
    });

    removeLoading(loadingId);

    if (!res.ok) {
      addMessage(`Error: ${escapeHtml(await responseDetail(res))}`, 'tutor');
      return;
    }

    const data = await res.json();
    const tutorText = data.reply || '(no response)';
    let html = escapeHtml(tutorText);

    if (data.corrections && data.corrections.length > 0) {
      for (const c of data.corrections) {
        html += '<div class="correction">';
        if (c.correction) html += `<div class="label">Correction</div><div>${escapeHtml(c.correction)}</div>`;
        if (c.why) html += `<div class="why">${escapeHtml(c.why)}</div>`;
        if (c.alternative) html += `<div class="alt">Alternative: ${escapeHtml(c.alternative)}</div>`;
        html += '</div>';
      }
    }

    addMessage(html, 'tutor');
    playTutorSpeech(tutorText);
    conversationHistory.push({ role: 'user', content: text });
    conversationHistory.push({ role: 'assistant', content: tutorText });
    if (conversationHistory.length > 50) conversationHistory = conversationHistory.slice(-50);
  } catch {
    removeLoading(loadingId);
    addMessage('Connection error — is the server running?', 'tutor');
  } finally {
    sendBtn.disabled = false;
    chatInput.focus();
  }
}

function addMessage(text, role) {
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  if (role === 'tutor') el.innerHTML = text;
  else el.textContent = text;
  msgContainer.appendChild(el);
  el.scrollIntoView({ behavior: 'smooth' });
  return el;
}

function addLoading() {
  const el = document.createElement('div');
  el.className = 'msg loading';
  el.id = 'loading-msg';
  el.innerHTML = '<div class="spinner"></div> Thinking...';
  msgContainer.appendChild(el);
  el.scrollIntoView({ behavior: 'smooth' });
  return 'loading-msg';
}

function removeLoading(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function getSettings() {
  return {
    lang: langSelect.value,
    level: levelSelect.value,
    mode: document.getElementById('modeSelect').value,
    locale: localeSelect.value,
    features: Array.from(featureList.querySelectorAll('input:checked')).map(input => input.value),
  };
}

// Model provider (bring your own OpenAI-compatible key)
function initProviderSettings() {
  providerSelect.value = localStorage.getItem('pc_llm_provider') || 'server';
  llmBaseUrl.value = localStorage.getItem('pc_llm_base_url') || DEFAULT_LLM_BASE_URL;
  llmModel.value = localStorage.getItem('pc_llm_model') || DEFAULT_LLM_MODEL;
  llmApiKey.value = sessionStorage.getItem('pc_llm_api_key') || '';
  toggleByok();
}

function toggleByok() {
  byokFields.hidden = providerSelect.value !== 'openai';
}

function hasByok() {
  return providerSelect.value === 'openai' && Boolean(sessionStorage.getItem('pc_llm_api_key'));
}

function llmHeaders() {
  if (!hasByok()) return {};
  return {
    'X-Polyglot-LLM-API-Key': sessionStorage.getItem('pc_llm_api_key'),
    'X-Polyglot-LLM-Base-URL': localStorage.getItem('pc_llm_base_url') || DEFAULT_LLM_BASE_URL,
    'X-Polyglot-LLM-Model': localStorage.getItem('pc_llm_model') || DEFAULT_LLM_MODEL,
  };
}

function saveProvider() {
  const key = llmApiKey.value.trim();
  if (providerSelect.value === 'openai' && !key) {
    showToast('Enter an API key to use your own provider.');
    return;
  }
  localStorage.setItem('pc_llm_provider', providerSelect.value);
  localStorage.setItem('pc_llm_base_url', llmBaseUrl.value.trim() || DEFAULT_LLM_BASE_URL);
  localStorage.setItem('pc_llm_model', llmModel.value.trim() || DEFAULT_LLM_MODEL);
  if (key) sessionStorage.setItem('pc_llm_api_key', key);
  else sessionStorage.removeItem('pc_llm_api_key');
  showToast('Model provider updated.');
  checkHealth();
}

providerSelect.addEventListener('change', toggleByok);
llmSaveBtn.addEventListener('click', saveProvider);

// Health check
async function checkHealth() {
  try {
    const res = await fetch(`${API}/health`);
    const data = await res.json();
    const serverLlm = Boolean(data.llm_available);
    const byokReady = hasByok();
    const llmOk = serverLlm || byokReady;
    sttAvailable = Boolean(data.stt_available);
    ttsAvailable = Boolean(data.tts_available);
    micBtn.disabled = !sttAvailable || sttBusy;
    micBtn.title = sttAvailable ? 'Push to talk' : 'Speech-to-text is not installed';
    speakReplies.disabled = !ttsAvailable;
    statusDot.className = 'status-dot ' + (llmOk ? 'online' : 'offline');
    statusLabel.textContent = byokReady
      ? 'BYOK provider'
      : (serverLlm ? 'LLM ready' : 'LLM unavailable');
    statusLabel.style.color = llmOk ? 'var(--green)' : 'var(--red)';
    const providerLabel = data.llm_provider ? ` (${data.llm_provider})` : '';
    document.getElementById('sidebarStatus').innerHTML =
      `<span class="${data.db_connected ? 'good' : 'bad'}">DB: ${data.db_connected ? 'connected' : 'disconnected'}</span>` +
      ` &middot; <span class="${llmOk ? 'good' : 'bad'}">LLM: ${byokReady ? 'BYOK' : (serverLlm ? 'ready' + escapeHtml(providerLabel) : 'offline')}</span>` +
      ` &middot; <span class="${sttAvailable ? 'good' : 'bad'}">STT: ${sttAvailable ? 'ready' : 'off'}</span>` +
      ` &middot; <span class="${ttsAvailable ? 'good' : 'bad'}">TTS: ${ttsAvailable ? 'ready' : 'off'}</span>` +
      (data.curriculum_loaded ? '' : ' &middot; <span class="bad">No curriculum</span>');
    sendBtn.disabled = !llmOk;
  } catch {
    statusDot.className = 'status-dot offline';
    statusLabel.textContent = 'Offline';
    sttAvailable = false;
    ttsAvailable = false;
    micBtn.disabled = true;
    speakReplies.disabled = true;
    document.getElementById('sidebarStatus').textContent = 'Server unreachable';
    sendBtn.disabled = true;
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Auto-load stored profile after language metadata is available.
async function restoreProfile() {
  if (!profileId) return;
  try {
    const res = await fetch(`${API}/api/v1/learner/profiles/${encodeURIComponent(profileName)}`);
    if (!res.ok) return;
    const profile = await res.json();
    if (languageMap.has(profile.target_language)) {
      langSelect.value = profile.target_language;
    }
    applyLanguageSelection(profile.proficiency_level, profile.locale);
  } catch { /* keep saved/local defaults */ }
}

async function init() {
  initProviderSettings();
  await loadLanguages();
  await restoreProfile();
  checkHealth();
  setInterval(checkHealth, 15000);
}

init();
</script>
