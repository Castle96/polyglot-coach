apiVersion: apps/v1
kind: Deployment
metadata:
  name: polyglot-coach
  namespace: polyglot-coach
  labels:
    app: polyglot-coach
spec:
  replicas: 1
  selector:
    matchLabels:
      app: polyglot-coach
  template:
    metadata:
      labels:
        app: polyglot-coach
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: regcred
      containers:
        - name: polyglot-coach
          image: 100.120.207.67:30529/castle96/polyglot-coach:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: TZ
              value: America/Chicago
            - name: OLLAMA_HOST
              value: http://ollama-svc.esp32-dev.svc:11434
            - name: PYTHONPATH
              value: /app
            - name: POLYGLOT_LOG_LEVEL
              value: INFO
            - name: POLYGLOT_CURRICULUM_PATH
              value: /app/curriculum
            - name: POLYGLOT_DB_PATH
              value: /app/storage/polyglot.db
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: storage
              mountPath: /app/storage
            - name: profiles
              mountPath: /app/profiles
            - name: curriculum
              mountPath: /app/curriculum
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: polyglot-coach-storage
        - name: profiles
          persistentVolumeClaim:
            claimName: polyglot-coach-profiles
        - name: curriculum
          persistentVolumeClaim:
            claimName: polyglot-coach-curriculum
